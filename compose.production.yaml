name: avatar-delivery

services:
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    env_file: ${AVATAR_ENV_FILE:-/srv/avatar-delivery/shared/runtime.env}
    environment:
      APP_VERSION: ${APP_RELEASE_SHA:?APP_RELEASE_SHA is required}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: avatar-delivery-api
    env_file: ${AVATAR_ENV_FILE:-/srv/avatar-delivery/shared/runtime.env}
    environment:
      APP_VERSION: ${APP_RELEASE_SHA:?APP_RELEASE_SHA is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 1.25
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); sys.exit(0 if data.get('ok') else 1)"
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 20s

  worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: avatar-delivery-worker
    command: ["python", "-m", "backend.app.worker"]
    env_file: ${AVATAR_ENV_FILE:-/srv/avatar-delivery/shared/runtime.env}
    environment:
      APP_VERSION: ${APP_RELEASE_SHA:?APP_RELEASE_SHA is required}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    mem_limit: 192m
    cpus: 0.25
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time,redis; c=redis.Redis.from_url(os.environ['REDIS_URL']); value=c.get('avatar:worker:heartbeat'); sys.exit(0 if value and time.time()-float(value)<30 else 1)"
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: avatar-delivery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avatar_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-avatar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    mem_limit: 576m
    cpus: 0.75
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - /srv/avatar-delivery/data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: avatar-delivery-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$${REDIS_PASSWORD}"
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - /srv/avatar-delivery/data/redis:/data
